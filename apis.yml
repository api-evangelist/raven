name: Raven
description: >-
  Raven is a runtime security platform that protects applications from the
  inside, detecting and preventing malicious code execution as it happens rather
  than relying only on perimeter defenses. Its capabilities span Runtime
  Prevention (blocking exploit execution regardless of CVE availability), Runtime
  ADR (application-level attack detection and response with forensics), Runtime
  AI-Agents (discovering and monitoring AI agents in an environment), Runtime SCA
  (prioritizing vulnerable dependencies by actual execution), and Runtime
  Gatekeeper (keeping risky applications out of production). The platform is
  self-hosted on Kubernetes, deployed via Helm/OCI charts and a sensor operator
  across AWS, Azure, and GCP, and is positioned as an application-level
  alternative to WAF, EDR, RASP, SCA, and ASPM tools. Raven is a portfolio
  company of Norwest Venture Partners.
